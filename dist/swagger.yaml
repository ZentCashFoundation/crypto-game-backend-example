openapi: 3.0.3
info:
  title: Crypto Game Backend Example API
  version: "1.0.0"
  description: |
    Simple educational Node.js backend for crypto-powered games.
    This API allows user registration, login, payment verification, balance management, and game sessions.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Auth
    description: User registration and login
  - name: Payment
    description: Payment verification endpoints
  - name: Game
    description: Game session endpoints

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: strongpassword
                expectedAmount:
                  type: number
                  example: 10
      responses:
        "200":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario creado
                  paymentId:
                    type: string
                    example: 4a5f2b6c3e8d9f0a1234567890abcdef1234567890abcdef1234567890abcdef
        "400":
          description: Missing or invalid data
        "500":
          description: Internal server error

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: strongpassword
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  balance:
                    type: number
                    example: 0
                  paymentId:
                    type: string
                    example: 4a5f2b6c3e8d9f0a1234567890abcdef1234567890abcdef1234567890abcdef
        "400":
          description: Invalid credentials
        "500":
          description: Internal server error

  /payment/check:
    get:
      tags: [Payment]
      summary: Check pending payments and update balance
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Payment status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pago confirmado
                  amount:
                    type: number
                    example: 10
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /game/play:
    post:
      tags: [Game]
      summary: Start a game session and deduct balance
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Game session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Partida iniciada
                  sessionId:
                    type: integer
                    example: 1
        "400":
          description: Insufficient balance
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT