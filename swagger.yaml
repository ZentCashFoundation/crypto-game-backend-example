openapi: 3.0.3
info:
  title: Crypto Game Backend Example API
  version: "1.0.0"
  description: |
    Simple educational Node.js backend for crypto-powered games.
    This API allows user registration, login, payment verification, balance management, and game sessions.

servers:
  - url: https://api.games.zent.cash:3000/api
  
tags:
  - name: Auth
  - name: Games - Game
  - name: Games - Wallet
  - name: Exchange - Market
  - name: Exchange - Wallet


paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: strongpassword
      responses:
        "200":
          description: User created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created
        "400":
          description: Missing or invalid data.
        "500":
          description: Internal server error.

  /auth/login:
    post:
      tags: [Auth]
      summary: User login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: strongpassword
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 3
                  email:
                    type: string
                    example: user2@example.com
                  username:
                    type: string
                    example: Anonymous-1777407913546
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Invalid credentials.
        "500":
          description: Internal server error.

  /auth/changenick:
    post:
      tags: [Auth]
      summary: Change your username.
      description: |
        Updates the player's nickname. The new nickname will be used to identify the player in the system and in game rankings.
      security:
       - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: Picolo
      responses:
        "200":
          description: Nickname updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /auth/changeemail:
    post:
      tags: [Auth]
      summary: Change your email.
      description: |
        Updates the player's email address.
      security:
       - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: user@example.com
      responses:
        "200":
          description: Email updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /auth/deleteaccount:
    post:
      tags: [Auth]
      summary: Delete your account.
      description: |
        Deletes the player's account and all associated data.
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true                    

  /games/wallet/deposit:
    get:
      tags: [Games - Wallet]
      summary: Retrieves the data required to make a deposit.
      description: |
        Returns the payment information needed for a user to send funds to the system, including the deposit address and the identifiers required to correctly link the transaction.
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Payment status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    example: Ze3sg8L4LDCa1wBgp4FuykGzhPbngcJmzSmu6acYLW4zjarjjvBVUEUMjbYmKYfsZ6hcSTEudjnAngYfS8dYvxG32w21U7khk
                  paymentId:
                    type: string
                    example: e5dd72cee33ad67867d23efde6466b2604c7816c362982c5966c012192365434
                  integratedAddress:
                    type: string
                    example: Ze3mT8v6posHdGTJi7NrHjAEhYg2kMbqEJ8LGsbjrjTF9Q7jecziz5nA6dMpsDY55bHbSaLT9NGyW9Pvpixr4RYf9ZkaKZ3uGSra1wBgp4FuykGzhPbngcJmzSmu6acYLW4zjarjjvBVUEUMjbYmKYfsZ6hcSTEudjnAngYfS8dYvxG32w23D5Wqu  
                        
  /games/wallet/check:
    get:
      tags: [Games - Wallet]
      summary: Check pending payments and update balance.
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Payment status returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Confirmed payment
                  amount:
                    type: number
                    example: 10
        "401":
          description: Unauthorized.
        "500":
          description: Internal server error.

  /games/wallet/balance:
    get:
      tags: [Games - Wallet]
      summary: Retrieves the current account balance.
      security:
       - bearerAuth: []
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    example: 10
        "500":
          description: Internal server error.        

  /games/wallet/withdraw:
    post:
      tags: [Games - Wallet]
      summary: Withdraws funds from the account.
      security:
       - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, amount]
              properties:
                destination:
                  type: string
                  example: Ze3pRGcsw9YGBJ5h...
                amount:
                  type: number
                  example: 150
      responses:
        "200":
          description: Withdrawal successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Withdrawal sent:
                    type: string
                    example: Withdrawal sent
                  amount:
                    type: number
                    example: 2250
                  fee:
                    type: number
                    example: 150
                  balance:
                    type: number
                    example: 7500
                  txHash:
                    type: string
                    example: b49a7804c955a38df0d0c07cc5b9f876209b64f995d9a547ec41db560dd0e4a1
        "500":
          description: Withdrawal failed.

  /games/game/list:
    get:
      tags: [Games - Game]
      summary: List of games and prices.
      security:
       - bearerAuth: []
      responses:
        "200":
          description: List of games returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    cost:
                      type: number
              example:
                games:
                  - name: blackjack
                    cost: 15
                  - name: roulette
                    cost: 20
                  - name: slots
                    cost: 10          
        "500":
          description: Error fetching games.            

  /games/game/play:
    post:
      tags: [Games - Game]
      summary: Start a game session and deduct balance.
      security:
       - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game]
              properties:
                game:
                  type: string
                  example: blackjack
      responses:
        "200":
          description: Game session started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Game started
                  sessionId:
                    type: integer
                    example: 1
                  cost:
                    type: number
                    example: 15
        "400":
          description: Insufficient balance.
        "401":
          description: Unauthorized.
        "404":
          description: Game not found.
        "500":
          description: Error starting game.    

  /games/game/score:
    post:
      tags:  [Games - Game]
      summary: Submits the score achieved by the user for a specific game session.
      description: |
        Submits the score achieved by the user for a specific game session.
        A score can only be submitted once per session and must belong to the authenticated user.
        The endpoint validates that the session exists and has not already been scored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, score]
              properties:
                sessionId:
                  type: integer
                  example: 1500
                  description: Unique ID of the game session.
                score:
                  type: number
                  example: 2000
                  description: Score achieved in this session.
      responses:
        "200":
          description: The game session ended successfully and your score was submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "500":
          description: Error saving score.

  /games/game/rankinglist:
    post:
      tags:  [Games - Game]
      summary: List of the best players with their scores.
      description: |
        Returns a list of the best players ranked by their scores. The results are ordered from highest to lowest score and can be used to display a leaderboard of top players in the game.        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game]
              properties:
                game:
                  type: string
                  example: tetris
                  description: Game name.
                rank:
                  type: number
                  example: 10
                  description: Number of positions on the list.
      responses:
        "200":
          description: List of the best players with their scores.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    score:
                      type: number
              example:
                games:
                  - username: Anonymous-06
                    score: 15
                  - username: Anonymous-05
                    score: 20
                  - username: Anonymous-04
                    score: 10               
        "400":
          description: Game required.

  /exchange/market/tickers:
    get:
      tags: [Exchange - Market]
      summary: Market related statistics for all markets.
      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of market tickers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                        pair:
                          type: string
                          example: ZTC_LTC
                        last_price:
                          type: string
                          example: "0.00000000000500"
                        bid_price:
                          type: string
                          example: "0.00000000000400"
                        ask_price:
                          type: string
                          example: "0.00000000000600"
                        spread:
                          type: string
                          example: "0.00000000000200"
                        updated_at:
                          type: string
                          format: date-time
                          example: 2026-04-30T18:58:19.000Z 
  
  /exchange/market/ticker:
    get:
      tags: [Exchange - Market]
      summary: Market related statistics for a specific market.
      security:
        - bearerAuth: []

      parameters:
        - in: query
          name: pair
          required: true
          schema:
            type: string
            example: ZTC_LTC
          description: Trading pair (e.g. ZTC_LTC)

      responses:
        "200":
          description: Market ticker for the specified market.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 1
                      pair:
                        type: string
                        example: ZTC_LTC
                      last_price:
                        type: string
                        example: "0.00000000000500"
                      bid_price:
                        type: string
                        example: "0.00000000000400"
                      ask_price:
                        type: string
                        example: "0.00000000000600"
                      spread:
                        type: string
                        example: "0.00000000000200"
                      updated_at:
                        type: string
                        format: date-time
                        example: 2026-04-30T18:58:19.000Z

  /exchange/market/orderbook:
    get:
      tags: [Exchange - Market]
      summary: Get orderbook for a trading pair.
      description: Returns aggregated bid and ask orders for a given market pair.
      parameters:
        - name: pair
          in: query
          required: true
          schema:
            type: string
            example: ZTC_LTC
          description: Trading pair.

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            example: 50
          description: Maximum number of price levels per side.

      responses:
        "200":
          description: Orderbook retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pair:
                    type: string
                    example: ZTC_LTC
                  bids:
                    type: array
                    description: Buy orders [price, amount].
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number
                      example: [100.0, 11.5]
                  asks:
                    type: array
                    description: Sell orders [price, amount].
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number
                      example: [101.0, 9.2]

        "400":
          description: Invalid request.
          content:
            application/json:
              example:
                error: Pair required.

        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                error: Error fetching orderbook.                  
  
  /exchange/wallet/deposit:
    post:
      tags: [Exchange - Wallet]
      summary: Get deposit address.
      security:
       - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket:
                  type: string
                  example: ZTC
                network:
                  type: string
                  example: mainnet  
      responses:
        "200":
          description: Deposit Address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    example: Ze355i4pnjf8w1fh7QHZnkEV2qWS2wVA7eSW8B2AVELv5BktYCq5MyBXoz2zy6QpdGHS5mbhDRCtHJGKUrsZmZqf2zuhM7yap
                  paimend_id:
                    type: string
                    example: 649ab054a2d293d76023e4042d32dd83ea74bcb42eae367ce7160ec4189ebed4
                  integrated_address:
                    type: string
                    example: Ze3N3Y7ATZZ9u9n8Jwjj7YHmDcog2tFuD94e1kRcZjaKAQDdmg1ytznHRheSvHFTsjAGLTjuEw6ZrHbQJskSSnWgHm6jQguqX5f8w1fh7QHZnkEV2qWS2wVA7eSW8B2AVELv5BktYCq5MyBXoz2zy6QpdGHS5mbhDRCtHJGKUrsZmZqf2zujhMYns
                  memo: 
                    type: string
                    example: 215569874

        "400":
          description: Ticker required or unsupported asset.
        "401":
          description: Unauthorized. 
        "429": 
          description: Wallet generation in progress.
        "500":
          description: Wallet generation failed.

  /exchange/wallet/balances:
      get:
        tags: [Exchange - Wallet]
        summary: Get balances.
        security:
        - bearerAuth: []
        responses:
          "200":
            description: Get Balances.
            content:
              application/json:
                schema:
                  type: array
                  items:
                    type: object
                    properties:
                      asset:
                        type: string
                      available:
                        type: string
                      locked:
                        type: string
                      total:
                        type: string  
                example:
                  balances:
                    - asset: ZTC
                      available: "15"
                      locked: "2"
                      total: "17"
                    - asset: LTC
                      available: "1"
                      locked: "1"
                      total: "2"
          "500":
            description: Error fetching balances. 

  /exchange/wallet/balance:
        get:
          tags: [Exchange - Wallet]
          summary: Get balance.
          security:
          - bearerAuth: []
          parameters:
            - name: asset
              in: query
              required: true
              schema:
                type: string
                example: ZTC
              description: Asset Ticker.
          responses:
            "200":
              description: Get Balance.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      result:
                        type: object
                        properties:
                          asset:
                            type: string
                            example: ZTC
                          available:
                            type: string
                            example: "18"
                          locked:
                            type: string
                            example: "2"
                          total:
                            type: string
                            example: "20"
            "400":
              description: Asset required.                 
            "500":
              description: Error fetching balance.                            
                          
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
